rm:none}.primary{background:#1974cd;border-color:#3991ed;font-weight:750}.secondary{background:#263a53}.danger{background:#5b3038;border-color:#864c58}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;margin:14px 0;scrollbar-width:thin}.tabs button{white-space:nowrap;padding:9px 12px}.tabs button.active{background:#2276d0;border-color:#3991ed}.bar{background:#293c56;border-radius:30px;height:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#3bbd9b,#6ce1ae);transition:width .25s}.choice{display:block;width:100%;text-align:left;margin:9px 0;line-height:1.4}.choice.correct{border-color:#41cc8b;background:#164934}.choice.wrong{border-color:#fa7a7a;background:#52272d}.choice.selected{border-color:#67b9ff;background:#173b5c}.question-prompt{font-size:1.2rem;line-height:1.5}.timer{font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:800;color:#ffce86;background:#422f22;padding:7px 11px;border-radius:10px}.timer.low{color:#ff9797;background:#49252c}.domain{border:1px solid #30435c;padding:14px 15px;border-radius:13px;margin:9px 0;background:#102038}.domain-title{display:flex;justify-content:space-between;gap:12px;line-height:1.4}.lesson-body{line-height:1.7}.lesson-list button{text-align:left;min-height:70px}.reel{position:relative;overflow:hidden;max-width:520px;margin:10px auto;min-height:460px;border-radius:22px;background:radial-gradient(circle at 75% 20%,#234a78,#0c182a 65%);border:1px solid #47617f;display:flex;flex-direction:column;justify-content:space-between;padding:22px}.reel:before{content:"";position:absolute;width:220px;height:220px;border:3px solid #58b7ff44;border-radius:50%;top:80px;right:-70px;animation:orbit 9s linear infinite;pointer-events:none}.reel>*{position:relative;z-index:1}.reel .eyebrow{font-size:.75rem;letter-spacing:.12em;color:#92d5ff;text-transform:uppercase;font-weight:800}.reel .hook{font-size:clamp(1.65rem,7vw,2.3rem);line-height:1.1;font-weight:900;letter-spacing:-.04em;margin:13px 0}.reel .visual{font-size:4rem;text-align:center}.reel .beat{font-size:1.2rem;line-height:1.45;min-height:90px;font-weight:650}.reel .beat strong{color:#78d6ff}.reel-footer{display:flex;gap:8px;flex-wrap:wrap}.reel-footer button{flex:1}.reel-progress{height:5px;background:#304c68;border-radius:10px;overflow:hidden}.reel-progress div{height:100%;background:#7ad3ff}.links a{display:inline-block;margin:7px 10px 5px 0;color:#91c7ff}.badge{font-size:.75rem;border:1px solid #415d79;border-radius:99px;padding:4px 8px;color:#c1d2e5}.status-ok{color:#73e2aa}.status-warn{color:#ffc76b}.footer{font-size:.8rem;color:#9baec5;margin-top:25px;line-height:1.55}.summary-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #30435c}label{display:block;margin:10px 0 5px}input[type=file]{width:100%}.smallbtn{padding:7px 10px;font-size:.87rem}.callout{border-left:3px solid #53b6ef;padding:6px 12px;color:#bdd3e8}.success{border-color:#4abe8d;background:#12352e}.track{position:relative}.track.disabled{opacity:.72}.track.disabled:after{content:"COMING NEXT";position:absolute;top:15px;right:15px;font-size:.68rem;letter-spacing:.1em;color:#b6c5d5}.track.current{border-color:#3991ed;box-shadow:0 0 0 1px #3991ed44}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:560px){main{padding:10px 12px 30px}.hero,.card{padding:16px}.reel{min-height:calc(100svh - 240px);padding:18px}.two-col{grid-template-columns:1fr}.tabs{margin:10px 0}}

const D=window.CCSK_DOMAINS,Q=window.CCSK_QUESTIONS,DOMAIN_WEIGHTS=[5,5,5,5,4,4,6,7,5,6,5,3],STORAGE='cloudsec-command-v4';
const lessons=[
['Think in cloud boundaries','Cloud security begins by identifying which layers the provider operates and which the customer configures. IaaS leaves more operating responsibility to the customer; PaaS and SaaS shift more layers to the provider. The exact boundary depends on the service and contract. Map identities, data flows, management-plane access and failure assumptions before choosing controls.','Cloud service models · shared responsibility · deployment models','Cloud definition · abstraction and orchestration · essential characteristics · service and deployment models · CSA Enterprise Architecture Model · shared responsibility'],
['Governance makes policy usable','Cloud governance turns business risk appetite into ownership, guardrails, standards and review. Name a service owner, classify data, document responsibilities, build approval and exception paths, and track outcomes. Good governance enables teams to move safely without assuming a provider takes over customer accountability.','Service ownership · policies · exceptions · metrics','Governance hierarchy · stakeholders and strategy · requirements and contracts · CCM · CSA STAR · policies'],
['Assess evidence, not slogans','Risk assessment connects assets, threats, likelihood, impact and existing controls. Audit evidence must match the service, region, period and customer use. Provider reports can support assurance, but customers may still have complementary controls. Record residual risk with an accountable owner and treatment plan.','Risk treatment · assurance scope · evidence · compliance','Cloud risk management · provider assessment · cloud register · jurisdictions and regulations · compliance inheritance · audit artifacts · GRC tools'],
['People and process are controls','Cloud security depends on clear roles, trained teams, acquisition reviews, change coordination and vendor oversight. Separate duties for high-impact actions, plan backups for key roles and make approved workflows practical enough that staff do not need to bypass them.','Roles · procurement · separation of duties · culture','CSP organization capabilities · identity provider mappings · shared services · hybrid and multicloud · SaaS'],
['Identity is the new perimeter','Use federation, MFA and conditional access for workforce sign-in. Give people and workloads narrowly scoped permissions, favor temporary credentials, review access and revoke sessions during offboarding. Authentication proves who is connecting; authorization must still check whether that identity can access this specific resource.','Federation · least privilege · workload identity · access reviews','Federation standards and flows · authentication and authorization · credentials · entitlements · privileged access'],
['Telemetry must survive an attacker','Collect relevant identity, management-plane, network and workload events. Protect logs from alteration, retain them long enough for investigations, synchronize time, correlate signals and tune detections. Monitoring only matters when alerts reach an accountable response team.','Log integrity · detection · retention · alert triage','Management-plane, service, application and resource logs · telemetry sources · collection and retention · cascading log architecture · CSPM · AI monitoring'],
['Network paths define exposure','Segment workloads, restrict ingress and egress, protect management access and use authenticated encryption across sensitive paths. Private endpoints can reduce public exposure, but do not replace identity checks. Review route changes as trust-boundary changes and test failover paths.','Segmentation · private connectivity · egress · resilience','CSP infrastructure responsibilities · resilience · software-defined networks · connectivity controls · IaC · ZTNA · SASE'],
['Treat workloads as changing assets','Harden and track images, patch based on risk, remove unnecessary privileges, protect orchestration control planes and use workload identities instead of stored long-lived keys. Validate configuration continuously: a secure launch baseline can drift or be changed by a later deployment.','Images · containers · serverless · patching · drift','VM images and snapshots · containers and orchestration · runtime security · serverless and FaaS · IAM and secrets · AI workload threats and shared responsibility'],
['Protect data through its full life','Classify data, minimize what is collected, restrict access, protect keys, monitor sharing, set retention and verify disposal. Backups and replicas inherit the data’s sensitivity. Encryption helps confidentiality, but does not replace authorization, retention governance or key availability planning.','Classification · keys · DLP · lifecycle · data residency','Storage types · classification · access policies · encryption and key management · DLP · DSPM · object storage · AI data security'],
['Build security into applications','Threat model early. Validate input, enforce authorization server-side, protect secrets, scan dependencies and secure CI/CD identities. Treat AI prompts, retrieved text and generated output as untrusted. The application must enforce user permissions and constrain tools outside the model itself.','Secure SDLC · APIs · CI/CD · AI application security','Secure SDLC · threat modeling and testing · architecture and resilience · application IAM and secrets · DevSecOps · CI/CD · WAF and API gateways'],
['Plan response before the incident','Cloud response needs roles, evidence procedures, provider contacts and tested containment actions. Preserve relevant evidence, revoke compromised authority, communicate through legal and privacy channels when required, and validate restoration against RTO and RPO. Run exercises and track corrective actions.','Forensics · containment · provider coordination · recovery','Incident response lifecycle · provider coordination · cloud forensics · containment, eradication and recovery · lessons learned'],
['Connect newer strategies to fundamentals','Zero Trust, DevSecOps, infrastructure as code, AI systems, data lakes and cloud analytics extend core security practices. They do not remove accountability. Govern data and identities, secure automation, verify provenance and evaluate technologies against a real threat model and business need.','Zero Trust · DevSecOps · AI · telemetry · data lakes','Zero Trust principles, pillars and maturity · AI workload characteristics · AI security intersections']
];
const refs=[
['CSA CCSK v5 Prep Kit','https://cloudsecurityalliance.org/artifacts/ccsk-v5-prep-kit','Official study guide, curriculum, 50 public sample questions, glossary and more. Use sample items on CSA’s page; this app does not reproduce them.'],
['CSA CCSK exam and domains','https://cloudsecurityalliance.org/education/ccsk','Public exam facts: 60 questions, 120 minutes, open-book, 80% pass threshold.'],
['CSA Security Guidance v5','https://cloudsecurityalliance.org/artifacts/security-guidance-v5','Deeper reference for the 12 domain areas.'],
['CSA Cloud Controls Matrix v4.1 and CAIQ','https://cloudsecurityalliance.org/artifacts/cloud-controls-matrix-v4-1','Control framework and cloud provider assessment resources.'],
['LinkedIn Learning CCSK Cert Prep','https://www.linkedin.com/learning/certificate-of-cloud-security-knowledge-ccsk-cert-prep','CSA-created short video course; requires LinkedIn Learning access.'],
['CSA: Introducing CCSK v5 on YouTube','https://www.youtube.com/watch?v=tL8I0BJ0gPs','Official short introduction to version 5.'],
['Cybrary CCSK course','https://www.cybrary.it/course/ccsk','Supplemental lecture course; check exam facts against CSA because pages can contain older details.'],
['Intrinsec free CCSK v5 quiz','https://intrinsecsecurity.com/lesson/ccsk-v-5-public-quiz/','Independent instructor-written sample; use as a linked reference, not copied content.'],
['ISC2 AI Security certification update','https://www.isc2.org/new-ai-certification','Current status of ISC2’s AI security certification development.'],
['CSA AI Controls Matrix','https://cloudsecurityalliance.org/artifacts/ai-controls-matrix-v1-1','Current CSA AI security control framework reference.']
];
const fresh=()=>({answers:[],completed:[],examHistory:[],microDone:[],challengeDue:0,challengeReminder:false,goals:10});let data;try{data={...fresh(),...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{data=fresh()};
let tab='home',session=null,answerChoice=null,feedback=false,reviewMode=false,idx=0,timerId=null,remaining=0,timerDeadline=0,challengeNotifyTimer=null,reelIndex=0,reelBeat=0;
const $=()=>document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(STORAGE,JSON.stringify(data));}
function shell(html){$('app').innerHTML=`<nav class="tabs">${[['home','⌂ Overview'],['study','Study'],['micro','⚡ Micro-lessons'],['practice','Practice'],['exams','Timed exams'],['references','References'],['progress','Progress']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav>${session&&session.seconds&&tab!=='quiz'&&tab!=='result'?`<div class="card"><span class="status-warn">Timed session in progress</span> <button class="smallbtn right" onclick="tab='quiz';quiz()">Resume · ${formatTime(remaining)}</button></div>`:''}${html}<div class="footer">Independent study app by Lamoremi Labs. Not affiliated with or endorsed by Cloud Security Alliance or ISC2. All practice items in this app are original and are not actual exam questions. The app is a study aid, not a guarantee of passing. Progress is saved in this browser on this device.</div>`;document.getElementById('headCount').textContent=`${Q.length} original questions`;}
function go(t){tab=t;render();window.scrollTo(0,0)}
function render(){if(tab==='home')return home();if(tab==='study')return study();if(tab==='lesson')return lesson();if(tab==='micro')return micro();if(tab==='practice')return practice();if(tab==='exams')return exams();if(tab==='quiz')return quiz();if(tab==='result')return result();if(tab==='references')return references();if(tab==='progress')return progress();}
function home(){const n=data.answers.length,ok=data.answers.filter(x=>x.correct).length,pct=n?Math.round(ok/n*100):0;const due=Math.max(0,data.challengeDue-Date.now());shell(`<section class="hero"><span class="pill">CCSK v5 · TRACK 1</span><h2>Cloud security is a series of decisions.</h2><p class="muted">Build CCSK judgment with concise lessons, original scenario questions and timed open-book practice. Your question bank has <strong>${Q.length} original items</strong>—three times the public exam length.</p><div class="row"><button class="primary" onclick="startPractice(10,'Mixed practice')">Start a 10-question session</button><button onclick="go('study')">Study a domain</button><button onclick="go('exams')">Exam modes</button></div></section><div class="grid"><div class="card"><small>Questions answered</small><div class="stat">${n}</div></div><div class="card"><small>Practice accuracy</small><div class="stat">${n?pct+'%':'—'}</div></div><div class="card"><small>Study domains</small><div class="stat">12</div></div><div class="card"><small>Next hourly challenge</small><div class="stat" style="font-size:1.25rem">${due?formatTime(due):'Ready now'}</div></div></div><div class="two-col"><section class="card track current"><span class="pill">CURRENT TRACK</span><h3>Certificate of Cloud Security Knowledge</h3><p class="muted">CCSK v5 · 12 domains · 60 questions · 120 minutes · open-book · 80% passing reference.</p><div class="row"><button class="primary" onclick="go('exams')">Train for CCSK</button><button onclick="go('references')">Study resources</button></div></section><section class="card track disabled"><span class="pill">TRACK 2</span><h3>CCSP</h3><p class="muted">Next: build a separate track with the current CCSP outline, its own lessons, labs and original questions.</p></section><section class="card track disabled"><span class="pill">TRACK 3</span><h3>AI security</h3><p class="muted">Later: choose a target credential and add a dedicated track. CCSK v5 AI/GenAI topics are included in this bank.</p></section><section class="card"><h3>Five-minute challenge</h3><p class="muted">One advanced scenario, capped at five minutes. New challenge available hourly.</p><div class="row"><button class="primary" ${due?'disabled':''} onclick="startChallenge()">${due?'Cooling down':'Take challenge'}</button><button onclick="setupReminder()">${data.challengeReminder?'Reminder enabled':'Remind me when ready'}</button></div><small id="reminderNote">${data.challengeReminder?'Notification permission is enabled; reminder requires the app page to remain open.': 'Browser notifications are optional and need permission.'}</small></section></div><div class="card"><div class="topline"><h3>Domain coverage</h3><button class="smallbtn right" onclick="go('progress')">Full progress →</button></div>${D.map((d,i)=>{const qs=data.answers.filter(a=>a.domain===i),c=qs.filter(a=>a.correct).length,percent=qs.length?Math.round(c/qs.length*100):0;return `<div class="domain"><div class="domain-title"><strong>${i+1}. ${esc(d)}</strong><small>${qs.length?`${percent}% · ${qs.length} attempts`:'Not yet assessed'}</small></div><div class="bar" style="margin-top:8px"><div class="fill" style="width:${percent}%"></div></div></div>`}).join('')}</div>`)}
function study(){shell(`<div class="topline"><div><h2>Study the 12 CCSK v5 domains</h2><p class="muted">Short original lessons; open CSA’s references for the complete source material.</p></div></div><div class="lesson-list grid">${D.map((d,i)=>{const complete=data.completed.includes(i);return `<button class="card" onclick="openLesson(${i})"><span class="pill">DOMAIN ${String(i+1).padStart(2,'0')}</span><h3>${esc(d)} ${complete?'✓':''}</h3><small>${DOMAIN_WEIGHTS[i]} questions in the official 60-item blueprint · ${esc(lessons[i][2])}</small></button>`}).join('')}</div><div class="card"><h3>Study loop</h3><p class="muted">Read a quick lesson → do a domain drill → mark uncertain questions → revisit them after a delay → finish with open-book timed practice.</p></div>`)}
function openLesson(i){tab='lesson';reelIndex=i;render()}
function lesson(){const i=reelIndex,l=lessons[i],done=data.completed.includes(i);shell(`<div class="card"><span class="pill">DOMAIN ${String(i+1).padStart(2,'0')}</span><h2>${esc(D[i])}</h2><p class="badge">${esc(l[2])}</p><article class="lesson-body"><p>${esc(l[1])}</p><h3>Curriculum checkpoints</h3><p>${esc(l[3])}</p></article><div class="callout"><strong>Apply it:</strong> Ask what the business needs, which party can control the relevant layer, what evidence proves the control works, and who owns residual risk.</div><div class="row" style="margin-top:15px"><button class="primary" onclick="markComplete(${i})">${done?'Completed ✓':'Mark studied'}</button><button onclick="startDomain(${i})">Practice this domain</button><button onclick="go('study')">All domains</button></div><p class="links"><a target="_blank" rel="noopener" href="${refs[0][1]}">Official CCSK Prep Kit ↗</a><a target="_blank" rel="noopener" href="${refs[2][1]}">Security Guidance v5 ↗</a></p></div>`)}
function markComplete(i){if(!data.completed.includes(i))data.completed.push(i);save();lesson()}
function micro(){const i=reelIndex,l=lessons[i],bits=l[1].split(/(?<=[.!?])\s+/).filter(Boolean),done=data.microDone.includes(i);if(reelBeat>=bits.length){shell(`<div class="reel"><div><div class="reel-progress"><div style="width:100%"></div></div><p class="eyebrow">⚡ QUICK CHECK · DOMAIN ${i+1}</p><div class="hook">${esc(D[i])}</div></div><div><p class="beat">${esc(l[0])}</p><p class="muted">${esc(l[2])}</p><p class="callout">${esc(bits[Math.min(1,bits.length-1)])}</p></div><div class="reel-footer"><button onclick="reelBeat=0;micro()">Replay</button><button class="primary" onclick="if(!data.microDone.includes(${i}))data.microDone.push(${i});save();reelIndex=(${i}+1)%12;reelBeat=0;micro()">${done?'Next concept':'Got it · next →'}</button></div></div><p class="muted" style="text-align:center">Bite-size text lessons, designed for a quick phone study break.</p>`);return}const pct=Math.round((reelBeat+1)/(bits.length+1)*100);shell(`<div class="row"><button onclick="go('study')">← All lessons</button><button class="right" onclick="reelIndex=(${i}+1)%12;reelBeat=0;micro()">Skip →</button></div><div class="reel"><div><div class="reel-progress"><div style="width:${pct}%"></div></div><p class="eyebrow">⚡ 20-SECOND CONCEPT · DOMAIN ${i+1} / 12</p><div class="hook">${esc(l[0])}</div></div><div><div class="visual">${['☁️','🧭','🔎','👥','🔐','📡','🌐','🖥️','🗄️','🧩','🚨','🤖'][i]}</div><p class="beat">${esc(bits[reelBeat])}</p></div><div class="reel-footer"><button onclick="reelBeat=Math.max(0,reelBeat-1);micro()" ${reelBeat===0?'disabled':''}>Back</button><button class="primary" onclick="reelBeat++;micro()">${reelBeat===bits.length-1?'Quick check →':'Next beat →'}</button></div></div><p class="muted" style="text-align:center">Text-first micro-lessons; no external streaming or account required.</p>`)}
function practice(){shell(`<div class="hero"><span class="pill">PRACTICE</span><h2>Reason through the scenario.</h2><p class="muted">Immediate explanations and domain targeting. Practice questions are written for this app; they do not reproduce exam or third-party items.</p><div class="row"><button class="primary" onclick="startPractice(10,'Mixed practice')">10-question mixed quiz</button><button onclick="startPractice(5,'Quick drill')">5-question quick drill</button></div></div><div class="card"><label for="domainPick">Choose a domain drill</label><select id="domainPick">${D.map((d,i)=>`<option value="${i}">${i+1}. ${esc(d)}</option>`).join('')}</select><div class="row" style="margin-top:10px"><button onclick="startDomain(Number(document.getElementById('domainPick').value))">Start selected domain</button><button onclick="startWeakDomain()">Focus my weakest domain</button></div></div><div class="card"><h3>Question bank</h3><p class="muted">${Q.length} questions total · 15 per official CCSK v5 domain · randomized selections · instant rationales.</p></div>`)}
function startPractice(n,label){const ids=shuffle(Q.map((_,i)=>i)).slice(0,n);begin(ids,{mode:'practice',label,timed:false})}
function startDomain(d){const ids=shuffle(Q.map((q,i)=>q.domain===d?i:-1).filter(i=>i>=0)).slice(0,10);begin(ids,{mode:'practice',label:D[d],timed:false})}
function startWeakDomain(){let counts=D.map((_,d)=>{let a=data.answers.filter(x=>x.domain===d);return {d,n:a.length,p:a.length?a.filter(x=>x.correct).length/a.length:0}});counts.sort((a,b)=>a.n===0?-1:b.n===0?1:a.p-b.p);startDomain(counts[0].d)}
function begin(ids,opts){session={ids,mode:opts.mode,label:opts.label,seconds:opts.seconds||0,started:Date.now(),answers:{},submitted:false};idx=0;answerChoice=null;feedback=false;reviewMode=false;if(opts.seconds){remaining=opts.seconds;timerDeadline=Date.now()+opts.seconds*1000;runTimer()}tab='quiz';quiz()}
function proportionalDomainQuotas(n){const quotas=DOMAIN_WEIGHTS.map(w=>Math.floor(w*n/60));let left=n-quotas.reduce((sum,q)=>sum+q,0);const order=shuffle(DOMAIN_WEIGHTS.map((w,domain)=>({domain,remainder:(w*n)%60}))).sort((a,b)=>b.remainder-a.remainder);for(let i=0;i<left;i++)quotas[order[i].domain]++;return quotas}function balancedQuestionIds(n){const quotas=proportionalDomainQuotas(n);let picked=[];D.forEach((_,d)=>picked.push(...shuffle(Q.map((q,i)=>q.domain===d?i:-1).filter(i=>i>=0)).slice(0,quotas[d])));return shuffle(picked)}function startExam(n,seconds,label){begin(balancedQuestionIds(n),{mode:'exam',label,seconds})}
function startMicroExam(){let selected=[];const advancedByDomain=D.map((_,d)=>Q.map((q,i)=>({q,i})).filter(x=>x.q.domain===d&&x.q.difficulty==='Advanced'));const domains=shuffle(advancedByDomain.map((_,i)=>i)).slice(0,3);for(const d of domains)selected.push(shuffle(advancedByDomain[d])[0].i);begin(selected,{mode:'exam',label:'Micro exam · cross-domain',seconds:12*60})}
function startChallenge(){if(Date.now()<data.challengeDue){alert('The hourly challenge is cooling down.');return}data.challengeDue=Date.now()+60*60*1000;save();scheduleReminderIfOpen();const candidates=Q.map((q,i)=>({q,i})).filter(x=>x.q.difficulty==='Advanced');const item=shuffle(candidates)[0];begin([item.i],{mode:'hourly',label:'Five-minute challenge',seconds:5*60})}
function runTimer(){stopTimer();timerTick();if(session&&!session.submitted)timerId=setInterval(timerTick,1000)}function timerTick(){if(!session||!session.seconds||session.submitted)return;remaining=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));if(remaining===0){stopTimer();submitSession(true);return}if(tab==='quiz'){const el=document.getElementById('timeLeft');if(el){el.textContent=formatTime(remaining);el.classList.toggle('low',remaining<=60)}}}function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function formatTime(seconds){const m=Math.floor(seconds/60),s=seconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function quiz(){if(!session)return go('home');if(reviewMode)return showReview();const q=Q[session.ids[idx]],chosen=session.answers[q.id];const isExam=session.mode==='exam'||session.mode==='hourly';const timer=session.seconds?`<span class="timer ${remaining<=60?'low':''}" id="timeLeft">${formatTime(remaining)}</span>`:'';shell(`<div class="topline"><div><span class="pill">${esc(session.label.toUpperCase())}</span><p class="muted">Question ${idx+1} of ${session.ids.length} · Domain ${q.domain+1}: ${esc(D[q.domain])} · ${esc(q.difficulty)}</p></div><div class="right">${timer}</div></div><div class="bar"><div class="fill" style="width:${Math.round((idx+(chosen!==undefined?1:0))/session.ids.length*100)}%"></div></div><div class="card"><p class="question-prompt"><strong>${esc(q.prompt)}</strong></p>${q.options.map((o,i)=>{let cls='choice';if(isExam){if(chosen===i)cls+=' selected'}else if(feedback){if(i===q.answer)cls+=' correct';else if(i===chosen)cls+=' wrong'}return `<button class="${cls}" ${(!isExam&&feedback)?'disabled':''} onclick="selectAnswer(${i})">${q.type==='tf'?esc(o):String.fromCharCode(65+i)+'. '+esc(o)}</button>`}).join('')}${!isExam&&feedback?`<div class="card"><strong class="${chosen===q.answer?'status-ok':'status-warn'}">${chosen===q.answer?'Correct':'Review this one'}</strong><p>${esc(q.explanation)}</p><small>Topic: ${esc(q.topic)} · Original app-authored item</small></div>`:''}<div class="row" style="margin-top:13px"><button onclick="moveQuestion(-1)" ${idx===0?'disabled':''}>← Previous</button><button onclick="toggleFlag('${q.id}')">${isFlagged(q.id)?'★ Flagged':'☆ Flag for review'}</button><button class="primary right" onclick="${idx===session.ids.length-1?"finishSession()":"moveQuestion(1)"}" ${!isExam&&!feedback?'disabled':''}>${idx===session.ids.length-1?'Finish session':'Next →'}</button>${isExam?`<button class="danger" onclick="finishSession()">Submit exam</button>`:''}</div><p class="muted">${isExam?'Exam mode: explanations appear after submission. Open-book reference links are in the References tab.':'Choose an answer to see the explanation.'}</p></div>`)}
function selectAnswer(choice){if(!session||session.submitted)return;if(session.seconds)timerTick();if(!session||session.submitted)return;const q=Q[session.ids[idx]];if(session.mode==='practice'&&feedback)return;session.answers[q.id]=choice;answerChoice=choice;if(session.mode==='practice'){feedback=true;const good=choice===q.answer;data.answers.push({id:q.id,domain:q.domain,correct:good,time:Date.now(),confidence:'practice'});save()}quiz()}
function moveQuestion(dir){if(!session)return;idx=Math.max(0,Math.min(session.ids.length-1,idx+dir));answerChoice=session.answers[Q[session.ids[idx]].id]??null;feedback=session.mode==='practice'&&answerChoice!==null;quiz()}
function finishSession(){if(!session||session.submitted)return;if(session.seconds)timerTick();if(!session||session.submitted)return;if((session.mode==='exam'||session.mode==='hourly')&&Object.keys(session.answers).length<session.ids.length&&!confirm('Some questions are unanswered. Submit anyway?'))return;submitSession(false)}
function completeChallenge(){if(!session||session.mode!=='hourly')return;data.challengeReminder=!!data.challengeReminder;save();scheduleReminderIfOpen()}
function submitSession(auto){if(!session||session.submitted)return;session.submitted=true;stopTimer();const isExam=session.mode==='exam'||session.mode==='hourly';if(isExam){for(const id of session.ids){const q=Q[id],c=session.answers[q.id];data.answers.push({id:q.id,domain:q.domain,correct:c===q.answer,time:Date.now(),confidence:session.mode})}const score=session.ids.filter(id=>session.answers[Q[id].id]===Q[id].answer).length;data.examHistory.push({label:session.label,mode:session.mode,total:session.ids.length,correct:score,date:Date.now(),auto});if(session.mode==='hourly')completeChallenge();save()}reviewMode=true;idx=0;tab='result';result()}
function result(){if(!session)return go('home');const ids=session.ids,isExam=session.mode==='exam'||session.mode==='hourly',answered=ids.filter(id=>session.answers[Q[id].id]!==undefined),correct=ids.filter(id=>session.answers[Q[id].id]===Q[id].answer).length,percent=Math.round(correct/ids.length*100),passed=isExam&&session.mode==='exam'&&ids.length===60?percent>=80:isExam&&session.mode==='exam'&&ids.length===20?percent>=80:null;shell(`<div class="card ${passed===true?'success':''}"><span class="pill">${esc(session.label.toUpperCase())} · COMPLETE</span><h2>${correct} / ${ids.length} correct</h2><div class="stat">${percent}%</div><p class="muted">${answered.length} answered · ${ids.length-answered.length} unanswered. ${passed===null?'Use the rationales to decide what to review next.':passed?'At or above the public 80% CCSK passing reference. Keep building consistency across domains.':'Below the public 80% CCSK passing reference. Review explanations and try a fresh set.'}</p>${session.mode==='hourly'?`<p class="callout">Next hourly challenge: ${formatTime(Math.ceil(Math.max(0,data.challengeDue-Date.now())/1000))} remaining.</p>`:''}<div class="row"><button class="primary" onclick="reviewMode=true;idx=0;tab='quiz';showReview()">Review answers and explanations</button><button onclick="session=null;go('progress')">View progress</button><button onclick="session=null;go('exams')">Another mode</button></div></div><div class="card"><h3>Domain breakdown</h3>${D.map((d,k)=>{const list=ids.filter(id=>Q[id].domain===k);if(!list.length)return '';const good=list.filter(id=>session.answers[Q[id].id]===Q[id].answer).length;return `<div class="summary-row"><span>${esc(d)}</span><strong>${good}/${list.length}</strong></div>`}).join('')}</div>`)}
function showReview(){const q=Q[session.ids[idx]],c=session.answers[q.id];shell(`<div class="topline"><div><h2>Review answer ${idx+1} / ${session.ids.length}</h2><small>Domain ${q.domain+1} · ${esc(q.topic)} · ${esc(q.difficulty)}</small></div><span class="right ${c===q.answer?'status-ok':'status-warn'}">${c===q.answer?'Correct':'Incorrect or unanswered'}</span></div><div class="card"><p class="question-prompt"><strong>${esc(q.prompt)}</strong></p>${q.options.map((o,i)=>`<div class="choice ${i===q.answer?'correct':i===c&&c!==q.answer?'wrong':''}">${q.type==='tf'?esc(o):String.fromCharCode(65+i)+'. '+esc(o)} ${i===q.answer?'✓':''}</div>`).join('')}<div class="card"><strong>Why</strong><p>${esc(q.explanation)}</p><small>Topic: ${esc(q.topic)} · ${esc(q.difficulty)} · Original app-authored item</small></div><div class="row"><button onclick="idx=Math.max(0,idx-1);showReview()" ${idx===0?'disabled':''}>← Previous</button><button class="primary right" onclick="idx=Math.min(session.ids.length-1,idx+1);showReview()" ${idx===session.ids.length-1?'disabled':''}>Next →</button><button onclick="session=null;go('exams')">Done</button></div></div>`)}
function exams(){const due=Math.max(0,data.challengeDue-Date.now());shell(`<div class="hero"><span class="pill">OPEN-BOOK PRACTICE</span><h2>Practice pace and lookup.</h2><p class="muted">Public CCSK v5 format: 60 random questions, 120 minutes, open-book, 80% passing score. CSA’s July 2026 CCSK v5 Knowledge Guide assigns the domain counts below. The live exam randomizes from its pool; this app uses that published weighting for full mocks and a proportional 20-question lite mock. Items are original practice questions, including multiple-choice and true/false.</p></div><div class="card"><h3>Published domain counts</h3><div class="grid">${D.map((d,i)=>`<div class="summary-row"><span>${i+1}. ${esc(d)}</span><small>${DOMAIN_WEIGHTS[i]} of 60</small></div>`).join('')}</div></div><div class="grid"><div class="card"><span class="pill">FULL EXAM</span><h3>60 questions · 120 minutes</h3><p class="muted">Two minutes per question on average. Review the source links before you begin; explanations appear after submission.</p><button class="primary" onclick="startExam(60,120*60,'Full CCSK mock exam')">Start full mock</button></div><div class="card"><span class="pill">LITE EXAM</span><h3>20 questions · 40 minutes</h3><p class="muted">One-third the full exam length at the same pace.</p><button onclick="startExam(20,40*60,'Lite CCSK mock exam')">Start lite exam</button></div><div class="card"><span class="pill">MICRO EXAM</span><h3>3 advanced questions · 12 minutes</h3><p class="muted">One question from each of three different domains. Each item is advanced and scenario-based.</p><button onclick="startMicroExam()">Start micro exam</button></div><div class="card"><span class="pill">HOURLY CHALLENGE</span><h3>1 advanced question · 5 minutes</h3><p class="muted">${due?`Available in ${formatTime(Math.ceil(due/1000))}.`:'Ready now.'} New question unlocks an hour after you start.</p><button class="primary" ${due?'disabled':''} onclick="startChallenge()">${due?'Cooling down':'Take the challenge'}</button> <button onclick="setupReminder()">${data.challengeReminder?'Reminder enabled':'Set reminder'}</button><p class="muted">A browser notification can be scheduled while this app page is open. Browser support and permission are required; closing the page may prevent delivery.</p></div></div><div class="card"><h3>Modes by intent</h3><div class="summary-row"><span>Practice</span><small>Immediate feedback and explanations</small></div><div class="summary-row"><span>Full and lite</span><small>Exam conditions; explanation review after submission</small></div><div class="summary-row"><span>Micro</span><small>Cross-domain synthesis in a short burst</small></div><div class="summary-row"><span>Hourly</span><small>Single high-difficulty retrieval challenge</small></div></div>`)}
function setupReminder(){if(!('Notification'in window)){alert('This browser does not support notifications.');return}Notification.requestPermission().then(p=>{if(p==='granted'){data.challengeReminder=true;save();scheduleReminderIfOpen();alert('Reminder enabled. Keep this app page open for the browser timer to deliver it. A closed page may not receive the reminder.')}else alert('Notifications were not enabled in browser settings.')});render()}
function scheduleReminderIfOpen(){if(!data.challengeReminder||!data.challengeDue||!('Notification'in window)||Notification.permission!=='granted')return;if(challengeNotifyTimer)clearTimeout(challengeNotifyTimer);const delay=Math.max(0,data.challengeDue-Date.now());challengeNotifyTimer=setTimeout(()=>{try{new Notification('CloudSec Command',{body:'Your next five-minute CCSK challenge is ready.'})}catch{}},delay)}
function isFlagged(id){return (data.flagged||[]).includes(id)}function toggleFlag(id){data.flagged=data.flagged||[];data.flagged=isFlagged(id)?data.flagged.filter(x=>x!==id):[...data.flagged,id];save();quiz()}
function references(){shell(`<div class="hero"><span class="pill">REFERENCE LIBRARY</span><h2>Use trusted sources to study.</h2><p class="muted">CSA’s Prep Kit is the primary starting point. External links remain owned by their publishers. We link to public sample questions rather than copying them into this app.</p></div><div class="card links">${refs.map((r,i)=>`<div class="summary-row"><span><strong>${esc(r[0])}</strong><br><small>${esc(r[2])}</small></span><a target="_blank" rel="noopener" href="${r[1]}">Open ↗</a></div>`).join('')}</div><div class="card"><h3>About this bank</h3><p class="muted">The 180 app questions were written for this project around public CCSK v5 domains and cloud-security concepts. They are not copied live exam items or third-party practice questions. Each question explains the reasoning behind the best response. The full mock follows the domain counts in CSA’s July 2026 CCSK v5 Knowledge Guide; the lite mock uses a proportional allocation. The live exam randomizes from its own pool, so this practice set does not predict item selection.</p></div>`)}
function progress(){const ans=data.answers,correct=ans.filter(a=>a.correct).length;const pct=ans.length?Math.round(correct/ans.length*100):0;shell(`<div class="hero"><span class="pill">PROGRESS</span><h2>Build readiness through consistency.</h2><p class="muted">Use domain performance and explanation review to target study. This estimate is not a validated probability of passing.</p><div class="grid"><div><small>Answers</small><div class="stat">${ans.length}</div></div><div><small>Overall accuracy</small><div class="stat">${ans.length?pct+'%':'—'}</div></div><div><small>Domains studied</small><div class="stat">${data.completed.length}/12</div></div><div><small>Timed sessions</small><div class="stat">${data.examHistory.length}</div></div></div></div>${D.map((d,i)=>{let a=ans.filter(x=>x.domain===i),c=a.filter(x=>x.correct).length,p=a.length?Math.round(c/a.length*100):0;return `<div class="domain"><div class="domain-title"><strong>${i+1}. ${esc(d)}</strong><small>${a.length?`${c}/${a.length} · ${p}%`:'No attempts yet'}</small></div><div class="bar" style="margin-top:8px"><div class="fill" style="width:${p}%"></div></div><button class="smallbtn" style="margin-top:9px" onclick="startDomain(${i})">Drill this domain</button></div>`}).join('')}<div class="card"><h3>Recent timed sessions</h3>${data.examHistory.length?data.examHistory.slice(-8).reverse().map(x=>`<div class="summary-row"><span>${esc(x.label)} · ${new Date(x.date).toLocaleDateString()}</span><strong>${x.correct}/${x.total} (${Math.round(x.correct/x.total*100)}%)</strong></div>`).join(''):'<p class="muted">Complete an exam mode to see results here.</p>'}</div><div class="card"><h3>Backup and restore</h3><p class="muted">Progress stays in this browser. Export a JSON backup to move it manually to another device.</p><div class="row"><button onclick="exportData()">Export progress</button><label class="smallbtn" for="restoreFile">Restore JSON</label><input id="restoreFile" type="file" accept="application/json" onchange="importData(this)"></div><button class="danger" style="margin-top:12px" onclick="resetProgress()">Reset this device’s progress</button></div>`)}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cloudsec-command-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){try{const o=JSON.parse(await el.files[0].text());if(!Array.isArray(o.answers)||!Array.isArray(o.completed))throw Error('This file is not a CloudSec progress backup.');data={...fresh(),...o};save();render()}catch(e){alert(e.message)}}function resetProgress(){if(confirm('Erase all CloudSec Command progress saved in this browser?')){data=fresh();save();render()}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});scheduleReminderIfOpen();render();
</script></body></html>
