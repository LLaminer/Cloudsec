nsform:scale(.7) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes orbit{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.reel:before,.reel .visual{animation:none}}@media(max-width:480px){main{padding:10px}.reel{min-height:calc(100dvh - 155px);padding:19px;border-radius:19px}}
</style></head><body><header><h1>🛡️ CloudSec Command</h1><small>Independent CCSP study companion · Lamoremi Labs</small></header><main><div id="app"></div></main><script>
const domains=[['Cloud Concepts, Architecture & Design',17],['Cloud Data Security',20],['Cloud Platform & Infrastructure Security',17],['Cloud Application Security',16],['Cloud Security Operations',17],['Legal, Risk & Compliance',13]];
const lessons=[
{d:0,title:'Shared Responsibility & Service Models',body:'Cloud security responsibilities depend on the service model. With IaaS, customers generally manage guest operating systems, applications, identity and data; providers manage physical infrastructure. PaaS shifts more platform responsibility to the provider. SaaS shifts application operation to the provider, but customers still manage their data, access policies and configurations. Responsibilities also depend on contract and provider.',tip:'Ask: which party can actually control the failed security measure?'},
{d:0,title:'Cloud Deployment & Architecture',body:'Public, private, hybrid and community clouds describe deployment arrangements. Multi-cloud uses more than one cloud provider. Cloud design balances resiliency, security, cost, portability, governance and compliance. Zero trust uses continuous verification and least privilege rather than trusting network location.',tip:'A business requirement should drive the architecture choice.'},
{d:1,title:'Data Lifecycle & Classification',body:'Classify data by sensitivity and business impact. Follow data from creation through storage, use, sharing, archival and secure destruction. Apply encryption, retention, access control and data loss prevention according to classification. Data residency and ownership requirements should be understood before selecting a cloud service.',tip:'Know where the data lives, who controls the keys and how it is deleted.'},
{d:1,title:'Encryption and Key Management',body:'Encryption at rest and in transit reduces exposure, but it does not replace authorization. Key management includes generation, storage, rotation, revocation and destruction. Customer-managed keys may increase control but also increase operational responsibility. Consider HSMs, separation of duties and key availability.',tip:'Encryption is only as trustworthy as its key lifecycle.'},
{d:2,title:'Virtualization & Isolation',body:'Hypervisors, containers and orchestration platforms introduce shared technology risks. Harden hosts and images, limit privileged operations, patch vulnerabilities and monitor workload isolation. Network segmentation and secure configuration reduce lateral movement. Assess tenant isolation and management-plane protections.',tip:'A container is not automatically a complete security boundary.'},
{d:2,title:'Business Continuity in the Cloud',body:'Recovery Time Objective (RTO) is the target time to restore service. Recovery Point Objective (RPO) is the acceptable data-loss window. Backups, multi-zone design, cross-region recovery and restoration testing serve different needs. Validate dependencies and costs.',tip:'RTO measures time; RPO measures data-loss tolerance.'},
{d:3,title:'Secure Software Development',body:'Integrate security throughout requirements, design, development, testing, deployment and maintenance. Use threat modeling, dependency scanning, secret management, code review and automated testing. API authentication, authorization and input validation remain essential in cloud-native applications.',tip:'Prevent vulnerabilities early instead of relying only on production monitoring.'},
{d:3,title:'AI Services & Application Risk',body:'Cloud-hosted AI applications inherit ordinary API, identity and data risks while adding model-specific threats. Prompt injection can manipulate model behavior; retrieval pipelines can expose sensitive documents; model and training data need governance. Treat AI output as untrusted and enforce authorization outside the model.',tip:'A system prompt is not an access-control boundary.'},
{d:4,title:'Logging, Monitoring & Response',body:'Centralize relevant audit, identity, network and workload logs. Protect their integrity and retention, correlate events and define alert triage. Incident response requires preparation, detection, containment, eradication, recovery and lessons learned. Understand provider support and evidence access limits.',tip:'Logs only help when they are retained, protected and reviewed.'},
{d:4,title:'Change & Configuration Management',body:'Maintain secure baselines, configuration inventories and approved changes. Infrastructure as code supports repeatability, review and drift detection. Patch based on risk and validate changes with testing and rollback planning. Privileged access should be limited and auditable.',tip:'A repeatable deployment can repeat insecure settings too.'},
{d:5,title:'Contracts, Privacy & Compliance',body:'Cloud contracts and service-level agreements should specify security obligations, audit rights, breach notification, data location, subcontractors, termination and data return or destruction. Regulatory requirements vary by jurisdiction. Assurance reports support due diligence but do not transfer accountability.',tip:'Confirm requirements and evidence before signing the contract.'},
{d:5,title:'Risk Management & Third Parties',body:'Identify assets, threats, vulnerabilities, likelihood and impact. Risk responses include avoid, mitigate, transfer and accept. Evaluate provider controls, supply-chain dependencies and concentration risk. Business owners should make informed risk acceptance decisions within governance processes.',tip:'A vendor certification is evidence, not a guarantee of security.'}
];
const questions=[
[0,'A company moves a legacy VM into an IaaS environment. Who typically patches the guest operating system?',['The cloud provider','The customer','The ISP','The hypervisor manufacturer'],1,'In IaaS, the customer normally manages guest OS patches. The provider secures the underlying infrastructure.'],
[0,'A team wants to reduce implicit trust between internal services. Which approach fits best?',['Zero trust with identity-aware controls','A single perimeter firewall','Disable service logs','Shared administrator accounts'],0,'Zero trust verifies each request using identity, context and least privilege.'],
[0,'Which model generally places application patching under the provider’s responsibility?',['IaaS','Colocation','SaaS','On-premises hosting'],2,'SaaS providers operate the application; customers still control their identities, data and configurations.'],
[0,'A regulated workload cannot leave a defined jurisdiction. What should be checked FIRST?',['CPU performance','Data residency and provider processing locations','The dashboard theme','Autoscaling limits'],1,'Legal and residency constraints should inform provider and architecture selection.'],
[1,'A cloud storage bucket contains confidential records. What should determine its access controls?',['Object count','Data classification and business need','Provider popularity','File extensions alone'],1,'Classification and need-to-know guide appropriate protection.'],
[1,'A company uses customer-managed encryption keys. What new risk must it manage?',['The cloud can no longer fail','Loss or unavailability of keys','All data becomes public','IAM becomes unnecessary'],1,'Customers must protect and maintain keys throughout their lifecycle.'],
[1,'Which control MOST directly limits accidental disclosure of sensitive documents?',['DLP policy and classification','Larger disk capacity','Shorter DNS TTL','More CPU cores'],0,'DLP policies use classification and detection to help restrict sensitive data movement.'],
[1,'A business must securely retire encrypted cloud data. Which method can help when properly implemented?',['Crypto-erasure by destroying relevant keys','Rename the bucket','Hide the console','Disable alerts'],0,'Destroying encryption keys can render properly encrypted data unrecoverable, subject to architecture and retention constraints.'],
[2,'A containerized workload needs protection against lateral movement. What is MOST useful?',['Allow all east-west traffic','Network policies and least privilege','Run every container privileged','Disable image scanning'],1,'Segmentation and least privilege limit unauthorized communication.'],
[2,'An application has a 30-minute RPO. What does that mean?',['Restore service within 30 minutes','Accept at most about 30 minutes of data loss','Backups run once monthly','All incidents resolve in 30 minutes'],1,'RPO is the maximum acceptable data-loss window.'],
[2,'A cloud team wants to detect unapproved infrastructure changes. What helps MOST?',['Configuration drift monitoring','Disabling audit logs','Static passwords','Open management ports'],0,'Drift detection compares deployed state with approved baselines.'],
[2,'What is the primary purpose of tenant isolation?',['Reduce invoice size','Prevent cross-tenant access and interference','Avoid backups','Eliminate patching'],1,'Isolation protects workloads and data in shared infrastructure.'],
[3,'A developer accidentally commits a cloud API secret. What is the FIRST security action?',['Rotate or revoke the exposed secret','Add a comment to the commit','Ignore it if private','Delete monitoring logs'],0,'Treat exposed credentials as compromised and revoke/rotate promptly.'],
[3,'An LLM chatbot retrieves internal documents. Which control should enforce each user’s document permissions?',['The model’s system prompt','Authorization in the retrieval/application layer','A friendly warning message','Higher temperature'],1,'Authorization must be enforced by trusted application components, not model instructions.'],
[3,'When should threat modeling ideally begin?',['After a breach','During design and requirements','Only after production release','When the SLA expires'],1,'Early threat modeling reduces costly redesign and identifies controls before deployment.'],
[3,'Which practice best reduces software supply-chain risk?',['Pin and scan dependencies with provenance checks','Download arbitrary binaries','Share build credentials','Disable CI checks'],0,'Dependency scanning, provenance and controlled builds reduce supply-chain exposure.'],
[4,'A cloud incident requires forensic evidence. What should the team do FIRST?',['Delete suspicious instances','Follow the response plan and preserve relevant evidence','Turn off all logging','Notify social media'],1,'Preserve evidence according to the incident response process and legal requirements.'],
[4,'What is the main advantage of centralized security logging?',['Eliminates attacks','Supports correlation and investigation','Replaces IAM','Prevents all outages'],1,'Centralized logs enable cross-system detection and analysis.'],
[4,'Which control best limits damage from a stolen administrator credential?',['Least privilege and phishing-resistant MFA','Shared passwords','Permanent global admin rights','Public management interfaces'],0,'Least privilege reduces blast radius; strong MFA makes credential abuse harder.'],
[4,'A deployment introduces a security regression. What operational capability is most helpful?',['Documented rollback and change controls','Untracked manual edits','Disabled monitoring','Shared root account'],0,'Tested rollback procedures support safe recovery from problematic changes.'],
[5,'A provider claims compliance with a standard. What should a customer do?',['Assume all customer duties disappear','Review the scope and evidence against requirements','Stop risk assessments','Treat the claim as a warranty'],1,'Compliance evidence has scope and limitations; customers retain responsibilities.'],
[5,'Which contract term matters most for recovering data when leaving a provider?',['Logo placement','Data portability, return and deletion provisions','Free merchandise','Website colors'],1,'Exit terms should define data export, return and verified deletion.'],
[5,'Who should formally accept a significant residual business risk?',['An authorized risk owner','Any help desk user','A random vendor engineer','An unaudited script'],0,'Risk acceptance belongs to designated accountable business owners.'],
[5,'A vendor subcontracts processing of regulated data. What should be assessed?',['Subprocessor obligations and data handling','The vendor’s office snacks','Only the vendor’s homepage','Keyboard layouts'],0,'Subprocessor arrangements can affect privacy, residency and security obligations.']

const micros=[
{d:0,emoji:'🏢',title:'Who patches WHAT?',hook:'The cloud provider does NOT patch everything.',beats:['IaaS: the provider protects the physical infrastructure.','You still patch your <strong>guest OS</strong> and applications.','SaaS: the provider runs the app, but <strong>your users and data</strong> are still your problem.'],q:'You deploy a VM on IaaS. Who patches its guest OS?',options:['Cloud provider','Your organization','Internet provider'],answer:1,why:'In IaaS, customers normally patch the guest OS. The exact boundary is defined by the service and contract.'},
{d:0,emoji:'🔐',title:'Zero trust in 20 seconds',hook:'Inside the network ≠ trusted.',beats:['Old thinking: inside the perimeter means safe.','Zero trust: <strong>verify identity and context</strong> for every request.','Give only the <strong>minimum access</strong> needed.'],q:'Which action best matches zero trust?',options:['Trust internal IPs','Verify every access request','Share admin accounts'],answer:1,why:'Zero trust avoids implicit trust based on network location.'},
{d:1,emoji:'🗝️',title:'Encryption key trap',hook:'Encrypted data can STILL be lost.',beats:['Encryption protects data, but the key controls access.','Lose your customer-managed key? You may lose the data.','Protect the <strong>entire key lifecycle</strong>: creation, storage, rotation, recovery and deletion.'],q:'What is a major customer-managed key risk?',options:['Key loss','No need for IAM','All data is public'],answer:0,why:'Customer-managed keys increase control and operational responsibility.'},
{d:1,emoji:'📦',title:'Data lifecycle speedrun',hook:'Deletion is part of security.',beats:['Data moves through creation, storage, use, sharing and archival.','Apply controls based on <strong>classification</strong>.','Plan retention and <strong>verified deletion</strong> before the data exists.'],q:'What should guide sensitive-data controls?',options:['File extension','Data classification','Storage vendor logo'],answer:1,why:'Sensitivity and business impact drive protection across the lifecycle.'},
{d:2,emoji:'⏱️',title:'RTO vs RPO',hook:'Two acronyms. One exam favorite.',beats:['<strong>RTO</strong>: how long can the service be down?','<strong>RPO</strong>: how much data can you afford to lose?','RTO = <strong>time to recover</strong>. RPO = <strong>data-loss window</strong>.'],q:'A maximum of 15 minutes of lost data is which metric?',options:['RTO','RPO','MTTR'],answer:1,why:'RPO expresses the acceptable amount of data loss measured in time.'},
{d:2,emoji:'🧱',title:'Containers are not magic',hook:'A container is NOT a tiny VM.',beats:['Containers often share the host kernel.','Isolation is useful, but misconfiguration can expose the host.','Harden images, limit privileges and <strong>patch the host</strong>.'],q:'What is a key container security concern?',options:['Shared host kernel','No network support','Guaranteed isolation'],answer:0,why:'Shared-kernel architecture creates isolation and privilege risks.'},
{d:3,emoji:'🤖',title:'Prompt injection',hook:'An AI can read a trap disguised as data.',beats:['A document tells your AI: “ignore previous rules.”','That instruction is <strong>untrusted content</strong>, not authority.','Enforce access outside the model; validate tools and outputs.'],q:'Where must real access control be enforced?',options:['Only in the system prompt','In the application and tools','In the model greeting'],answer:1,why:'Prompts are not a reliable authorization boundary.'},
{d:3,emoji:'🔌',title:'API security quick hit',hook:'Logged in does NOT mean allowed.',beats:['Authentication: <strong>who are you?</strong>','Authorization: <strong>can you access THIS resource?</strong>','Every API request needs proper server-side authorization checks.'],q:'A user reads another user’s record by changing an ID. What failed?',options:['Authorization','Encryption at rest','DNS caching'],answer:0,why:'Object-level authorization must be checked for each requested resource.'},
{d:4,emoji:'🚨',title:'Logs or it didn’t happen',hook:'Your logs are an attack target too.',beats:['Collect identity, network, workload and audit events.','Centralize logs for <strong>correlation</strong> and detection.','Protect log integrity and retention for investigations.'],q:'Why centralize security logs?',options:['Prevent all breaches','Correlate activity across systems','Replace MFA'],answer:1,why:'Central logging improves visibility and investigations; it does not prevent every attack.'},
{d:4,emoji:'↩️',title:'Rollback beats panic',hook:'Your patch broke production. Now what?',beats:['Changes need approval, testing and a known baseline.','Infrastructure as code can make changes repeatable.','A tested <strong>rollback plan</strong> limits the blast radius.'],q:'What most directly helps reverse a bad deployment?',options:['Documented rollback','Disable all logs','Shared root password'],answer:0,why:'A tested rollback procedure restores a known working state.'},
{d:5,emoji:'📜',title:'Compliance ≠ security',hook:'A vendor badge is NOT a magic shield.',beats:['A provider audit report has a specific <strong>scope</strong>.','Your organization still owns its contractual and regulatory duties.','Read the evidence and map controls to your requirements.'],q:'What should you do with a vendor compliance claim?',options:['Assume total coverage','Review scope and evidence','Skip risk review'],answer:1,why:'Certifications and reports are evidence, not proof that all customer requirements are met.'},
{d:5,emoji:'⚖️',title:'Who accepts risk?',hook:'The help desk does NOT accept business risk.',beats:['Identify risk, estimate likelihood and impact.','Choose to mitigate, avoid, transfer or accept.','Significant residual risk needs an <strong>authorized owner</strong>.'],q:'Who should accept major residual business risk?',options:['Authorized risk owner','Any engineer','Cloud provider by default'],answer:0,why:'Risk acceptance is an accountable business decision.'}

let reelIndex=0,reelBeat=0,reelAnswer=null;
function microHome(){let done=data.microDone||[];shell(`<h2>⚡ Micro-learning</h2><p class="muted">Swipe-style, 15–30 second animated lessons. Tap through three fast beats, then answer a checkpoint. No sound or streaming needed.</p><div class="card"><strong>${done.length} / ${micros.length} mastered</strong><div class="bar" style="margin-top:10px"><div class="fill" style="width:${Math.round(done.length/micros.length*100)}%"></div></div><div class="micro-actions"><button class="primary" onclick="openReel(${micros.findIndex((_,i)=>!done.includes(i))<0?0:micros.findIndex((_,i)=>!done.includes(i))})">${done.length?'Continue reels':'Start learning'}</button><button onclick="openReel(Math.floor(Math.random()*micros.length))">Surprise me</button></div></div><div class="micro-grid">${micros.map((m,i)=>`<button class="card micro-card" onclick="openReel(${i})"><div class="emoji">${m.emoji}</div><h3>${esc(m.title)} ${done.includes(i)?'✓':''}</h3><small>Domain ${m.d+1} · ~20 seconds</small></button>`).join('')}</div>`)}
function openReel(i){reelIndex=(i+micros.length)%micros.length;reelBeat=0;reelAnswer=null;tab='reel';drawReel()}
function drawReel(){let m=micros[reelIndex],checkpoint=reelBeat>=m.beats.length;let pct=checkpoint?100:Math.round((reelBeat+1)/(m.beats.length+1)*100);shell(`<div class="micro-actions"><button onclick="go('micro')">← All reels</button><button onclick="openReel(${reelIndex-1})">← Previous</button><button onclick="openReel(${reelIndex+1})">Next reel →</button></div><div class="reel" aria-live="polite"><div><div class="reel-progress"><div style="width:${pct}%"></div></div><p class="eyebrow">⚡ Domain ${m.d+1} · ${reelIndex+1}/${micros.length} · ${checkpoint?'Knowledge check':'Fast lesson'}</p><div class="hook">${esc(m.hook)}</div></div><div><div class="visual">${m.emoji}</div>${checkpoint?`<h3>${esc(m.q)}</h3>${m.options.map((o,i)=>`<button class="mini-choice ${reelAnswer!==null?(i===m.answer?'correct':i===reelAnswer?'wrong':''):''}" ${reelAnswer!==null?'disabled':''} onclick="answerReel(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}${reelAnswer!==null?`<div class="reveal"><strong>${reelAnswer===m.answer?'✓ Nailed it!':'Not quite. Try the next one.'}</strong><div>${esc(m.why)}</div></div>`:''}`:`<p class="beat" key="${reelBeat}">${m.beats[reelBeat]}</p>`}</div><div class="reel-footer">${!checkpoint?`<button onclick="reelBeat=Math.max(0,reelBeat-1);drawReel()" ${reelBeat===0?'disabled':''}>Back</button><button class="primary" onclick="reelBeat++;drawReel()">${reelBeat===m.beats.length-1?'Test me →':'Next beat →'}</button>`:reelAnswer!==null?`<button onclick="openReel(${reelIndex})">Replay</button><button class="primary" onclick="openReel(${reelIndex+1})">Next reel →</button>`:`<button onclick="reelBeat=0;drawReel()">Replay lesson</button>`}</div></div><p class="muted" style="text-align:center">Animated micro-lessons, not recorded videos. Captions are always on.</p>`)}
function answerReel(i){if(reelAnswer!==null)return;reelAnswer=i;let done=data.microDone||[];if(i===micros[reelIndex].answer&&!done.includes(reelIndex)){done.push(reelIndex);data.microDone=done}data.microAttempts=data.microAttempts||[];data.microAttempts.push({id:reelIndex,correct:i===micros[reelIndex].answer,time:Date.now()});save();drawReel()}
const key='cloudsec-command-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{answers:[],reviews:{},completed:[],session:0}}catch{data={answers:[],reviews:{},completed:[],session:0}};const save=()=>localStorage.setItem(key,JSON.stringify(data));let tab='home',session=[],index=0,chosen=null,kind='practice',domainFilter='all';const $=()=>document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shell(body){$('app').innerHTML=`<nav>${[['home','Dashboard'],['learn','Lessons'],['micro','⚡ Reels'],['practice','Practice'],['progress','Progress']].map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav>${body}<div class="footer">Independent educational resource. Not affiliated with or endorsed by ISC2. Original practice questions; not actual exam items. Study material is a starting point, not a guarantee of passing. Progress is stored in this browser.</div>`}function go(t){tab=t;render()}function render(){if(tab==='home')return home();if(tab==='learn')return learn();if(tab==='micro')return microHome();if(tab==='practice')return practice();if(tab==='progress')return progress()}
function home(){let n=data.answers.length,correct=data.answers.filter(a=>a.correct).length;shell(`<div class="card"><span class="pill">Your study headquarters</span><h2>Prepare for CCSP, one decision at a time.</h2><p class="muted">12 concise lessons, 24 original scenario questions, weighted domain tracking and locally saved progress. A usable first release that we'll grow while you study.</p><button class="primary" onclick="start('diagnostic')">Start 12-question diagnostic</button> <button onclick="go('learn')">Read lessons</button> <button onclick="go('micro')">⚡ Watch micro-lessons</button></div><div class="grid"><div class="card"><small>Answered</small><h2>${n}</h2></div><div class="card"><small>Accuracy</small><h2>${n?Math.round(correct/n*100)+'%':'—'}</h2></div><div class="card"><small>Lessons completed</small><h2>${data.completed.length} / ${lessons.length}</h2></div></div><div class="card"><h3>Study plan</h3><p>Weeks 1–2: architecture and data. Weeks 3–4: infrastructure and applications. Weeks 5–6: operations and governance. Weeks 7–8: mixed practice and remediation. Extend to 12 weeks if needed.</p><p class="muted">Before booking, verify current exam requirements and outline at <a target="_blank" rel="noopener" href="https://www.isc2.org/certifications/ccsp">ISC2</a>.</p></div>`)}
function learn(){shell(`<h2>Lessons</h2><p class="muted">Short explanations followed by relevant practice questions.</p>${domains.map((d,i)=>`<div class="card"><h3>${i+1}. ${esc(d[0])} <small>${d[1]}% exam weight</small></h3>${lessons.map((l,j)=>l.d===i?`<button style="margin:4px" onclick="lesson(${j})">${data.completed.includes(j)?'✓ ':''}${esc(l.title)}</button>`:'').join('')}</div>`).join('')}`)}function lesson(i){let l=lessons[i];shell(`<div class="card"><small>Domain ${l.d+1}</small><h2>${esc(l.title)}</h2><article><p>${esc(l.body)}</p><p><strong>Exam mindset:</strong> ${esc(l.tip)}</p></article><button class="primary" onclick="complete(${i})">${data.completed.includes(i)?'Review complete ✓':'Mark lesson complete'}</button> <button onclick="start('domain',${l.d})">Practice this domain</button> <button onclick="go('learn')">All lessons</button></div>`)}function complete(i){if(!data.completed.includes(i))data.completed.push(i);save();lesson(i)}
function practice(){shell(`<div class="card"><h2>Practice center</h2><p>Each question includes an explanation after you answer. Questions are original and intended to build reasoning.</p><button class="primary" onclick="start('diagnostic')">12-question diagnostic</button> <button onclick="start('practice')">10-question mixed quiz</button><label for="domain">Domain practice</label><select id="domain" onchange="domainFilter=this.value"><option value="all">Choose a domain</option>${domains.map((d,i)=>`<option value="${i}" ${domainFilter==i?'selected':''}>${esc(d[0])}</option>`).join('')}</select> <button onclick="if(domainFilter==='all')alert('Choose a domain first');else start('domain',Number(domainFilter))">Start domain quiz</button><p class="muted">Questions answered before are eligible again. Each new session shuffles question order.</p></div>`)}
function start(type,d){kind=type;let pool=questions.map((q,i)=>i).filter(i=>type!=='domain'||questions[i][0]===d);for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}session=pool.slice(0,type==='diagnostic'?12:type==='practice'?10:pool.length);index=0;chosen=null;tab='quiz';question()}function question(){if(index>=session.length)return finish();let q=questions[session[index]],qid=session[index];shell(`<div class="card"><small>${kind==='diagnostic'?'Diagnostic':kind==='domain'?'Domain quiz':'Mixed practice'} · ${index+1} / ${session.length} · Domain ${q[0]+1}</small><div class="bar" style="margin:14px 0"><div class="fill" style="width:${100*index/session.length}%"></div></div><h2>${esc(q[1])}</h2>${q[2].map((a,i)=>`<button class="choice ${chosen!==null?(i===q[3]?'correct':i===chosen?'wrong':''):''}" ${chosen!==null?'disabled':''} onclick="answer(${i})">${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${chosen!==null?`<div class="card"><strong>${chosen===q[3]?'Correct!':'Not quite.'}</strong><p>${esc(q[4])}</p></div><button class="primary" onclick="next()">${index===session.length-1?'View results':'Next question →'}</button>`:''}</div>`)}function answer(i){if(chosen!==null)return;chosen=i;let q=questions[session[index]];data.answers.push({id:session[index],domain:q[0],correct:i===q[3],time:Date.now()});save();question()}function next(){index++;chosen=null;question()}function finish(){let recent=data.answers.slice(-session.length),correct=recent.filter(a=>a.correct).length;tab='results';shell(`<div class="card"><h2>Session complete</h2><h1>${correct} / ${session.length} correct</h1><p>${Math.round(correct/session.length*100)}% accuracy. Focus on understanding explanations, not memorizing options.</p><button class="primary" onclick="go('progress')">View domain progress</button> <button onclick="go('practice')">Practice again</button></div>`)}
function progress(){let n=data.answers.length;shell(`<h2>Readiness & progress</h2><p>⚡ Micro-lessons mastered: ${(data.microDone||[]).length} / ${micros.length}</p><p class="muted">Domain accuracy is based on all attempts, including repeats. It is not a validated probability of passing the actual exam.</p>${domains.map((d,i)=>{let a=data.answers.filter(x=>x.domain===i),c=a.filter(x=>x.correct).length,p=a.length?Math.round(c/a.length*100):0;return `<div class="card"><strong>${esc(d[0])}</strong> <small>· ${d[1]}% weight</small><p>${a.length?`${p}% correct · ${a.length} attempts`:'Not yet assessed'}</p><div class="bar"><div class="fill" style="width:${p}%"></div></div></div>`}).join('')}<div class="card"><h3>Back up your progress</h3><p class="muted">This app saves data on your current device. Export a backup before clearing browser data.</p><button onclick="exportData()">Export JSON backup</button> <label for="restore">Restore backup</label><input id="restore" type="file" accept="application/json" onchange="importData(this)"><p><button onclick="if(confirm('Erase all saved study progress on this device?')){data={answers:[],reviews:{},completed:[],session:0,microDone:[],microAttempts:[]};save();render()}">Reset local progress</button></p></div>`)}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cloudsec-progress.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){try{let o=JSON.parse(await el.files[0].text());if(!Array.isArray(o.answers)||!Array.isArray(o.completed))throw Error('Invalid backup');data=o;save();render()}catch(e){alert('Could not restore: '+e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
